---
# role: pam
# file: defaults/main.yml

# Identity provider selected in the native PAM and NSS configuration.
# Choices: sssd, winbind, local
# pam_provider: sssd

# Create home directories through the native PAM session module.
pam_mkhomedir: true

# Additional Red Hat profile features; home creation is controlled separately.
pam_authselect_features:
  - without-nullok
  - with-faillock

# Allow authselect to adopt unmanaged PAM/NSS files with its native backup mechanism.
pam_authselect_force: false

# Home roots below /home that need SELinux equivalence mappings to /home.
pam_home_roots: []
# pam_home_roots:
#   - /home/AD.EXAMPLE.COM

# Domain login groups checked during the account phase; [] disables this restriction.
pam_access_groups: []
# pam_access_groups:
#   - 'EXAMPLE\Linux Admins'

# Back up managed configuration files before replacing them.
pam_backup: true
