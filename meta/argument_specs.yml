---
# role: pam
# file: meta/argument_specs.yml

argument_specs:
  main:
    short_description: Select native authentication providers and home creation.
    options:
      pam_provider:
        type: str
        required: true
        choices:
          - sssd
          - winbind
          - local
        description: Identity provider selected in the native PAM and NSS configuration.
      pam_mkhomedir:
        type: bool
        required: false
        default: true
        description: Create home directories through the native PAM session module.
      pam_authselect_features:
        type: list
        elements: str
        required: false
        default:
          - without-nullok
          - with-faillock
        description: Additional Red Hat profile features; home creation is controlled separately.
      pam_authselect_force:
        type: bool
        required: false
        default: false
        description: Allow authselect to adopt unmanaged PAM/NSS files with its native backup
          mechanism.
      pam_home_roots:
        type: list
        elements: path
        required: false
        default: []
        description: Absolute home roots below /home for SELinux equivalence mappings; removed
          entries are not cleaned up.
