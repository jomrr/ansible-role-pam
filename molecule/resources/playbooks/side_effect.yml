---
# role: pam
# file: molecule/resources/playbooks/side_effect.yml

- name: PAM | Verify provider and home creation changes
  hosts: all
  gather_facts: true
  tasks:
    - name: PAM | Switch to winbind
      ansible.builtin.include_role:
        name: "{{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') }}"
      vars:
        pam_provider: winbind

    - name: PAM | Verify winbind replaced SSSD in the native selection
      ansible.builtin.import_tasks: ../tasks/verify_selection.yml
      vars:
        __pam_expected_provider: winbind
        __pam_expected_modules: [winbind, mkhomedir]

    - name: PAM | Switch to local accounts and disable home creation
      ansible.builtin.include_role:
        name: "{{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') }}"
      vars:
        pam_provider: local
        pam_mkhomedir: false

    - name: PAM | Verify local authentication and inactive optional modules
      ansible.builtin.import_tasks: ../tasks/verify_selection.yml
      vars:
        __pam_expected_provider: local
        __pam_expected_modules: []

    - name: PAM | Authenticate another local account without creating its home
      ansible.builtin.command:
        expand_argument_vars: false
        argv: [su, --login, --command, 'test ! -d "$HOME"', pam_home_disabled]
        stdin: Molecule-Pam-Only-1!
      changed_when: false
      no_log: true
