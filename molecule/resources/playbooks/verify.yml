---
# role: pam
# file: molecule/resources/playbooks/verify.yml

- name: PAM | Verify provider selection and home creation
  hosts: all
  gather_facts: true
  tasks:
    - name: PAM | Verify the selected native profiles and NSS sources
      ansible.builtin.import_tasks: ../tasks/verify_selection.yml
      vars:
        __pam_expected_provider: sssd
        __pam_expected_modules: [sss, mkhomedir]

    - name: PAM | Authenticate through the native PAM stack and create the home
      ansible.builtin.command:
        expand_argument_vars: false
        argv: [su, --login, --command, 'test -d "$HOME"', pam_home_enabled]
        stdin: Molecule-Pam-Only-1!
      changed_when: false
      no_log: true
