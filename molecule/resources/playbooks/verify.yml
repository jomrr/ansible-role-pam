---
# role: pam
# file: molecule/resources/playbooks/verify.yml

- name: PAM | Verify provider selection and ordered account access
  hosts: all
  gather_facts: true
  tasks:
    - name: PAM | Verify the selected native profiles and NSS sources
      ansible.builtin.import_tasks: ../tasks/verify_selection.yml
      vars:
        __pam_expected_provider: sssd
        __pam_expected_modules: [sss, mkhomedir, access]

    - name: PAM | Authenticate a group member through the native PAM stack
      ansible.builtin.command:
        expand_argument_vars: false
        argv: [su, --login, --command, 'test -d "$HOME"', pam_allowed]
        stdin: Molecule-Pam-Only-1!
      changed_when: false
      no_log: true

    - name: PAM | Reject the denied local account with its correct password
      ansible.builtin.command:
        argv: [su, --login, --command, 'true', pam_denied]
        stdin: Molecule-Pam-Only-1!
      register: __pam_denied_login
      changed_when: false
      failed_when: __pam_denied_login.rc == 0
      no_log: true
