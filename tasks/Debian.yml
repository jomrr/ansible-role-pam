---
# role: pam
# file: tasks/Debian.yml

- name: Debian | Install the account authorization profile
  become: true
  become_user: root
  ansible.builtin.template:
    src: pam_auth_update.j2
    dest: /usr/share/pam-configs/pam-access
    owner: root
    group: root
    mode: '0644'
    backup: "{{ pam_backup }}"
  when: pam_access_groups | length > 0
  notify: apply account profile

- name: PAM | Read the native PAM profile selection after package installation
  become: true
  become_user: root
  ansible.builtin.debconf:
    name: libpam-runtime
  register: __pam_selection
  changed_when: false
  check_mode: false

- name: PAM | Select managed PAM profiles without changing foreign profiles
  become: true
  become_user: root
  ansible.builtin.command:
    argv: >-
      {{ ['pam-auth-update', '--enable'] + __pam_enabled_profiles + ['--disable'] +
         (__pam_selection.current['libpam-runtime/profiles'].split(', ') |
          intersect(__pam_managed_profiles) | difference(__pam_enabled_profiles)) }}
  environment:
    DEBIAN_FRONTEND: noninteractive
  changed_when: true
  when: >-
    __pam_selection.current['libpam-runtime/profiles'].split(', ') |
    intersect(__pam_managed_profiles) | sort != __pam_enabled_profiles | sort
