---
# role: pam
# file: tasks/Debian.yml

- name: PAM | Provide the native login access profile
  become: true
  become_user: root
  ansible.builtin.copy:
    dest: /usr/share/pam-configs/access
    owner: root
    group: root
    mode: '0644'
    src: pam-access
  register: __pam_access_profile
  when: pam_access_rules | length > 0

- name: PAM | Read the native PAM profile selection after package installation
  become: true
  become_user: root
  ansible.builtin.debconf:
    name: libpam-runtime
  register: __pam_selection
  changed_when: false
  check_mode: false

- name: PAM | Select managed PAM profiles without changing foreign profiles
  become: true
  become_user: root
  ansible.builtin.command:
    argv: >-
      {{ ['pam-auth-update', '--enable'] + __pam_enabled_profiles + ['--disable'] +
         (__pam_selection.current['libpam-runtime/profiles'].split(', ') |
          intersect(__pam_managed_profiles) | difference(__pam_enabled_profiles)) }}
  environment:
    DEBIAN_FRONTEND: noninteractive
  changed_when: true
  when: >-
    __pam_access_profile.changed or
    __pam_selection.current['libpam-runtime/profiles'].split(', ') |
    intersect(__pam_managed_profiles) | sort != __pam_enabled_profiles | sort

- name: PAM | Remove the inactive native login access profile
  become: true
  become_user: root
  ansible.builtin.file:
    path: /usr/share/pam-configs/access
    state: absent
  when: pam_access_rules | length == 0
