---
# role: pam
# file: tasks/suse_module.yml

# pam-config reads the selections from its generated stacks.
- name: suse_module | Read the native PAM module selection
  ansible.builtin.command:
    argv: [pam-config, --query, "--{{ __pam_module.name }}"]
  register: __pam_query
  changed_when: false
  failed_when: __pam_query.rc != 0
  check_mode: false

# pam-config regenerates the complete stack and preserves the other selections.
- name: suse_module | Apply the native PAM module selection
  become: true
  become_user: root
  ansible.builtin.command:
    argv:
      - pam-config
      - "{{ __pam_module.enabled | ternary('--add', '--delete') }}"
      - "--{{ __pam_module.name }}"
  register: __pam_module_change
  changed_when: __pam_module_change.rc == 0
  failed_when: __pam_module_change.rc != 0
  when: (__pam_query.stdout | length > 0) != (__pam_module.enabled | bool)
