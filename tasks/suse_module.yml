---
# role: pam
# file: tasks/suse_module.yml

- name: PAM | Query the native PAM module
  become: true
  become_user: root
  ansible.builtin.command:
    argv: [pam-config, --query, "--{{ __pam_module.name }}"]
  register: __pam_query
  changed_when: false
  check_mode: false

- name: PAM | Apply the native PAM module state
  become: true
  become_user: root
  ansible.builtin.command:
    argv:
      - pam-config
      - "{{ __pam_module.enabled | ternary('--add', '--delete') }}"
      - "--{{ __pam_module.name }}"
  changed_when: true
  when: (__pam_query.stdout | length > 0) != (__pam_module.enabled | bool)
